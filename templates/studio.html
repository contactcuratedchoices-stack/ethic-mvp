{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-4xl px-5 py-12 md:py-20">
  <div class="glass rounded-3xl p-6 shadow-2xl sm:p-10 relative overflow-hidden">
    <!-- Decoration -->
    <div class="absolute -top-20 -right-20 w-64 h-64 bg-gold/10 rounded-full blur-3xl"></div>
    
    <div class="mb-8 text-center relative z-10">
      <h1 class="font-serif text-4xl font-bold text-white">The Story Studio</h1>
      <p class="mt-2 text-muted text-lg">Weave a personalized, value-driven tale for your little one.</p>
    </div>

    <!-- THE FORM -->
    <form id="story-form" class="grid gap-5 sm:grid-cols-2 relative z-10">
      <div class="sm:col-span-2">
        <label for="name" class="mb-2 block text-sm font-semibold text-gold-soft">Child's Name</label>
        <input id="name" name="name" type="text" required placeholder="e.g. Aarav" class="field w-full rounded-xl px-4 py-3" />
      </div>
      <div class="sm:col-span-2">
        <label for="native_place" class="mb-2 block text-sm font-semibold text-gold-soft">Native Place / Roots (For Cultural Touch)</label>
        <input id="native_place" name="native_place" type="text" required placeholder="e.g. Pune, Rajasthan" class="field w-full rounded-xl px-4 py-3" />
      </div>
      <div>
        <label for="age" class="mb-2 block text-sm font-semibold text-gold-soft">Age (3–10)</label>
        <select id="age" name="age" class="field w-full rounded-xl px-4 py-3">
          <option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option>
        </select>
      </div>
      <div>
        <label for="language" class="mb-2 block text-sm font-semibold text-gold-soft">Language</label>
        <select id="language" name="language" class="field w-full rounded-xl px-4 py-3">
          <option value="Hindi">Pure Hindi</option>
          <option value="Hinglish">Hinglish</option>
          <option value="English">English</option>
        </select>
      </div>
      <div class="sm:col-span-2">
        <label for="value" class="mb-2 block text-sm font-semibold text-gold-soft">Core Value to Teach (EQ Development)</label>
        <select id="value" name="value" class="field w-full rounded-xl px-4 py-3">
          <option value="Sharing & Empathy">Sharing & Empathy</option>
          <option value="Honesty & Truth">Honesty & Truth</option>
          <option value="Bravery & Courage">Bravery & Courage</option>
        </select>
      </div>
      <div class="sm:col-span-2 mt-2 p-4 rounded-xl border border-purple-soft/30 bg-navy-light/40 flex items-center gap-3">
        <!-- Custom Checkbox Style directly injected for this page -->
        <style>
          .custom-cb { appearance: none; width: 1.25em; height: 1.25em; border: 1px solid rgba(183,157,240,0.4); border-radius: 0.25em; display: grid; place-content: center; cursor: pointer; transition: all 0.2s; background-color: rgba(20,16,50,0.6); }
          .custom-cb::before { content: ""; width: 0.65em; height: 0.65em; transform: scale(0); transition: 120ms transform ease-in-out; box-shadow: inset 1em 1em #f4c95d; border-radius: 2px; }
          .custom-cb:checked { border-color: #f4c95d; }
          .custom-cb:checked::before { transform: scale(1); }
        </style>
        <input type="checkbox" id="generate_audio" class="custom-cb" checked />
        <div>
          <span class="block text-sm font-semibold text-gold-soft">🎙️ Generate Dadi's Audio Narration</span>
          <span class="block text-xs text-muted mt-0.5">Helps in auditory learning and reduces screen dependency.</span>
        </div>
      </div>
      <div class="sm:col-span-2 mt-4">
        <button type="submit" id="submit-btn" class="flex w-full items-center justify-center gap-2 rounded-full bg-gold px-7 py-4 text-lg font-bold text-navy shadow-gold transition hover:brightness-105 disabled:opacity-70">
          <span id="btn-label">Generate Magic ✨</span>
        </button>
      </div>
    </form>

    <!-- RESULT SECTION -->
    <div id="result" class="mt-10 hidden border-t border-purple-soft/20 pt-8">
      <div class="mb-4 flex items-center justify-center gap-2 text-sm font-semibold text-gold">
        <span class="h-1.5 w-1.5 rounded-full bg-gold animate-pulse"></span>
        Your story is ready
      </div>
      <h2 id="story-title" class="font-serif text-3xl font-bold text-center text-white"></h2>
      <div id="tags" class="mt-4 flex flex-wrap justify-center gap-2"></div>

      <!-- AUDIO PLAYER -->
      <audio id="real-audio-player" class="hidden"></audio>
      <div id="audio-container" class="mt-8 mx-auto max-w-lg rounded-2xl border border-purple-soft/30 bg-navy/60 p-4 hidden shadow-xl">
        <div class="flex items-center gap-4">
          <button id="play-btn" disabled class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-gold text-navy shadow-gold transition hover:brightness-105 disabled:opacity-50">
            <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" class="hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <div id="waveform" class="flex h-10 flex-1 items-center gap-[3px]"></div>
          <button id="speed-btn" class="rounded-lg bg-gold/15 border border-gold/30 px-3 py-1.5 text-xs font-bold text-gold hover:bg-gold/30">1x</button>
        </div>
        <div id="audio-error" class="hidden mt-3 rounded-lg bg-red-500/10 p-3 text-xs font-semibold text-red-400 border border-red-500/20 text-center"></div>
      </div>

      <div id="story-body" class="mt-8 space-y-4 text-pretty whitespace-pre-wrap leading-relaxed text-gray-300 font-medium text-lg px-2 md:px-8"></div>
    </div>
  </div>
</section>

<!-- Studio Logic (JavaScript) -->
<script>
  // Fake Waveform Generation
  const wf = document.getElementById('waveform');
  let bars = '';
  for (let i = 0; i < 30; i++) {
    const h = (20 + Math.abs(Math.sin(i * 0.9)) * 80).toFixed(2);
    bars += `<span style="display:block;width:3px;border-radius:9999px;background:#f4c95d;height:${h}%;opacity:.6;animation-delay:${(i * 0.05).toFixed(2)}s"></span>`;
  }
  if(wf) wf.innerHTML = bars;

  const audioEl = document.getElementById('real-audio-player');
  const playBtn = document.getElementById('play-btn');
  const iconPlay = document.getElementById('icon-play');
  const iconPause = document.getElementById('icon-pause');
  const speedBtn = document.getElementById('speed-btn');

  playBtn.addEventListener('click', () => {
    if (audioEl.paused) { audioEl.play(); iconPlay.classList.add('hidden'); iconPause.classList.remove('hidden'); } 
    else { audioEl.pause(); iconPause.classList.add('hidden'); iconPlay.classList.remove('hidden'); }
  });
  audioEl.addEventListener('ended', () => { iconPause.classList.add('hidden'); iconPlay.classList.remove('hidden'); });

  let speedIdx = 0; const speeds = [1, 1.25, 1.5, 2];
  speedBtn.addEventListener('click', () => { speedIdx = (speedIdx + 1) % speeds.length; audioEl.playbackRate = speeds[speedIdx]; speedBtn.innerText = speeds[speedIdx] + 'x'; });

  const form = document.getElementById('story-form');
  const result = document.getElementById('result');
  const btn = document.getElementById('submit-btn');
  const btnLabel = document.getElementById('btn-label');
  const audioContainer = document.getElementById('audio-container');
  const audioErrorBox = document.getElementById('audio-error');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const isAudioRequested = document.getElementById('generate_audio').checked;
    const data = {
      child_name: document.getElementById('name').value.trim(),
      native_place: document.getElementById('native_place').value.trim(),
      age: document.getElementById('age').value,
      language: document.getElementById('language').value,
      moral_value: document.getElementById('value').value,
      generate_audio: isAudioRequested 
    };

    btn.disabled = true;
    btnLabel.textContent = isAudioRequested ? 'Writing & Recording... ⏳' : 'Writing Story... ⏳';
    result.classList.remove('hidden'); audioContainer.classList.add('hidden'); audioErrorBox.classList.add('hidden');
    document.getElementById('story-title').textContent = 'Crafting magic...';
    document.getElementById('tags').innerHTML = '';
    document.getElementById('story-body').innerHTML = '<span class="text-gold animate-pulse">Sprinkling magic dust...</span>';

    try {
      const response = await fetch('/generate_story', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
      });
      const res = await response.json();
      
      if(res.success) {
          document.getElementById('story-title').textContent = `${data.child_name}'s Magical Tale`;
          document.getElementById('story-body').innerText = res.story;
          document.getElementById('tags').innerHTML = [data.moral_value, `Age ${data.age}`, data.language, data.native_place]
            .map(t => `<span class="rounded-full border border-gold/40 bg-gold/10 px-3 py-1 text-xs font-semibold text-gold-soft">${t}</span>`).join('');
            
          if(isAudioRequested) {
              audioContainer.classList.remove('hidden');
              if(res.audio_base64) {
                  audioEl.src = "data:audio/mpeg;base64," + res.audio_base64;
                  playBtn.disabled = false; iconPause.classList.add('hidden'); iconPlay.classList.remove('hidden');
              } else {
                  playBtn.disabled = true; audioErrorBox.classList.remove('hidden'); audioErrorBox.innerText = "❌ Audio Failed: " + (res.audio_error || "Try again.");
              }
          }
      } else { document.getElementById('story-body').innerText = '❌ Error: ' + res.error; }
    } catch(err) { document.getElementById('story-body').innerText = '❌ Server Error: Connection lost.'; }
    btn.disabled = false; btnLabel.textContent = 'Generate Magic ✨';
  });
</script>
{% endblock %}
