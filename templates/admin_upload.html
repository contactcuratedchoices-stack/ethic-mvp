<!-- NAYA SMART FORM -->
<form method="POST" class="space-y-4">
    
    <!-- State and Moral -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">State / Region *</label>
            <input type="text" name="state" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-indigo-500" placeholder="e.g. Rajasthan, Maharashtra">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">Moral Value *</label>
            <select name="moral" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-indigo-500">
                <option value="Honesty">Honesty</option>
                <option value="Courage">Courage</option>
                <option value="Sharing">Sharing</option>
                <option value="Respect">Respect</option>
                <option value="Kindness">Kindness</option>
            </select>
        </div>
    </div>

    <!-- 🚀 NAYE SMART TAGS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-indigo-50 p-4 rounded-lg border border-indigo-100">
        <div>
            <label class="block text-indigo-900 text-sm font-bold mb-2">Target Gender</label>
            <select name="target_gender" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-indigo-500">
                <option value="Any">Any / Both</option>
                <option value="Boy">Boy</option>
                <option value="Girl">Girl</option>
            </select>
        </div>
        <div>
            <label class="block text-indigo-900 text-sm font-bold mb-2">Age Range</label>
            <div class="flex items-center space-x-2">
                <input type="number" name="min_age" value="3" min="1" max="15" class="w-full px-3 py-2 border rounded-lg">
                <span>to</span>
                <input type="number" name="max_age" value="10" min="1" max="15" class="w-full px-3 py-2 border rounded-lg">
            </div>
        </div>
        <div>
            <label class="block text-indigo-900 text-sm font-bold mb-2">Theme</label>
            <select name="theme" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-indigo-500">
                <option value="General">General</option>
                <option value="Magic & Fairies">Magic & Fairies</option>
                <option value="Kings & Warriors">Kings & Warriors</option>
                <option value="Animals & Nature">Animals & Nature</option>
                <option value="Real-life Adventure">Real-life Adventure</option>
            </select>
        </div>
    </div>

    <!-- Core Story -->
    <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">Core Story (Raw Template) *</label>
        <textarea name="core_story" rows="6" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-indigo-500" placeholder="Paste the traditional story here..."></textarea>
    </div>

    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-700 transition">
        Save to Smart Database
    </button>
</form>
