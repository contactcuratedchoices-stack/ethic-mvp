{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

<style>
    .magical-font { font-family: 'Baloo 2', cursive; }
    
    /* Beautiful Single Card */
    .story-card {
        background: rgba(30, 27, 75, 0.6);
        border: 2px solid rgba(244, 201, 93, 0.4);
        border-radius: 1.5rem;
        padding: 2rem 2.5rem;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(244, 201, 93, 0.1);
        backdrop-filter: blur(12px);
        min-height: 250px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease-in-out;
    }

    /* Twinkling Stars Background */
    .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        animation: twinkle infinite ease-in-out;
    }
    @keyframes twinkle {
        0%, 100% { opacity: 0.1; transform: scale(0.5); }
        50% { opacity: 0.8; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
    }
</style>

<section class="relative mx-auto max-w-4xl px-5 py-12 min-h-screen overflow-hidden">
  
  <div id="stars-container" class="absolute inset-0 pointer-events-none z-0"></div>

  <div class="glass p-6 md:p-12 rounded-3xl border-t-4 border-t-gold shadow-[0_0_50px_rgba(244,201,93,0.1)] relative z-10">
    
    <div class="mb-8 flex justify-between items-center">
      <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-purple-soft hover:text-white transition bg-purple-soft/10 px-4 py-2 rounded-xl border border-purple-soft/30 hover:bg-purple-soft/20">
        ← Back to Library
      </a>
    </div>

    <div class="text-center mb-10">
      {% if story.moral %}
      <span class="inline-block px-4 py-1.5 bg-gradient-to-r from-gold/20 to-orange-500/20 text-gold text-xs uppercase tracking-widest font-extrabold rounded-full mb-5 border border-gold/40 shadow-[0_0_15px_rgba(244,201,93,0.3)]">
        ✨ {{ story.moral }} ✨
      </span>
      {% endif %}
      <h1 class="magical-font text-4xl md:text-5xl font-bold text-white leading-tight mb-3 drop-shadow-lg">
        {{ story.title }}
      </h1>
    </div>

    {% if story.audio_data %}
    <div class="mb-12 bg-gradient-to-r from-navy-light/80 via-purple-900/40 to-navy-light/80 p-5 md:p-6 rounded-3xl border border-gold/30 shadow-[0_0_30px_rgba(139,92,246,0.2)]">
      
      <p class="text-gold-soft text-xs font-bold tracking-widest uppercase text-center mb-4">Listen to the Magic</p>
      
      <div class="flex items-center gap-4">
        <button id="play-pause-btn" class="h-14 w-14 shrink-0 rounded-full bg-gradient-to-br from-gold to-orange-400 flex items-center justify-center text-navy shadow-[0_0_15px_rgba(244,201,93,0.6)] transition-all hover:scale-110">
          <svg id="icon-play" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>

        <div id="waveform" class="flex-1 cursor-pointer"></div>
      </div>
    </div>
    {% endif %}

    <div id="raw-story-content" class="hidden">{{ story.content }}</div>
    
    <div class="relative max-w-2xl mx-auto">
        <div id="story-card" class="story-card magical-font text-2xl md:text-3xl text-white text-center leading-relaxed">
            </div>

        <div class="flex items-center justify-between mt-6">
            <button id="prev-btn" class="px-5 py-2.5 rounded-full bg-purple-soft/20 text-purple-300 font-bold border border-purple-soft/30 hover:bg-purple-soft/40 transition disabled:opacity-30 disabled:cursor-not-allowed">
                ← Previous
            </button>
            
            <span id="page-counter" class="text-gold font-bold text-sm bg-gold/10 px-4 py-1.5 rounded-full border border-gold/20">
                Page 1
            </span>

            <button id="next-btn" class="px-5 py-2.5 rounded-full bg-gold/20 text-gold font-bold border border-gold/30 hover:bg-gold/40 transition disabled:opacity-30 disabled:cursor-not-allowed">
                Next →
            </button>
        </div>
    </div>

  </div>
</section>

<script>
  // 1. Confetti & Stars
  window.onload = function() {
      var duration = 3 * 1000;
      var animationEnd = Date.now() + duration;
      var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };
      function randomInRange(min, max) { return Math.random() * (max - min) + min; }
      var interval = setInterval(function() {
          var timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) { return clearInterval(interval); }
          var particleCount = 50 * (timeLeft / duration);
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }, colors: ['#f4c95d', '#8b5cf6', '#ffffff'] }));
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }, colors: ['#f4c95d', '#8b5cf6', '#ffffff'] }));
      }, 250);
  };

  const starContainer = document.getElementById('stars-container');
  for (let i = 0; i < 40; i++) {
      let star = document.createElement('div');
      star.className = 'star';
      let size = Math.random() * 3 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDuration = (Math.random() * 3 + 2) + 's';
      star.style.animationDelay = Math.random() * 2 + 's';
      starContainer.appendChild(star);
  }

  // 2. 🚀 REAL WAVEFORM LOGIC (Wavesurfer.js)
  const audioDataUrl = "{% if story.audio_data %}data:audio/wav;base64,{{ story.audio_data }}{% else %}''{% endif %}";
  
  if(audioDataUrl !== "''") {
      const wavesurfer = WaveSurfer.create({
          container: '#waveform',
          waveColor: 'rgba(244, 201, 93, 0.3)', // Dull gold for unplayed
          progressColor: '#f4c95d',             // Bright gold for played
          barWidth: 3,
          barGap: 3,
          barRadius: 3,
          height: 50,
          url: audioDataUrl
      });

      const playBtn = document.getElementById('play-pause-btn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');

      playBtn.addEventListener('click', () => {
          wavesurfer.playPause();
      });

      wavesurfer.on('play', () => {
          iconPlay.classList.add('hidden');
          iconPause.classList.remove('hidden');
          playBtn.classList.add('animate-pulse');
      });

      wavesurfer.on('pause', () => {
          iconPause.classList.add('hidden');
          iconPlay.classList.remove('hidden');
          playBtn.classList.remove('animate-pulse');
      });
      
      wavesurfer.on('finish', () => {
          iconPause.classList.add('hidden');
          iconPlay.classList.remove('hidden');
          playBtn.classList.remove('animate-pulse');
      });
  }

  // 3. 🚀 STORYBOOK (Single Card) LOGIC
  const rawText = document.getElementById('raw-story-content').innerText;
  // Paragraphs ko array me badalna (Khali line hata kar)
  const pages = rawText.split(/\n+/).filter(p => p.trim().length > 0);
  
  let currentPage = 0;
  const cardEl = document.getElementById('story-card');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  const counterEl = document.getElementById('page-counter');

  function renderPage(index) {
      // Fade out effect
      cardEl.style.opacity = 0;
      
      setTimeout(() => {
          // Set new text
          cardEl.innerText = pages[index];
          counterEl.innerText = `Page ${index + 1} of ${pages.length}`;
          
          // Button states
          prevBtn.disabled = index === 0;
          nextBtn.disabled = index === pages.length - 1;
          
          // Fade in effect
          cardEl.style.opacity = 1;
      }, 200); // 200ms delay for smooth transition
  }

  // Button Listeners
  prevBtn.addEventListener('click', () => {
      if(currentPage > 0) {
          currentPage--;
          renderPage(currentPage);
      }
  });

  nextBtn.addEventListener('click', () => {
      if(currentPage < pages.length - 1) {
          currentPage++;
          renderPage(currentPage);
      }
  });

  // Initialize first page if pages exist
  if(pages.length > 0) {
      renderPage(0);
  } else {
      cardEl.innerText = "The magic faded away... Story not found.";
      prevBtn.disabled = true;
      nextBtn.disabled = true;
  }
</script>
{% endblock %}
