{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    .magical-font { font-family: 'Baloo 2', cursive; }
    
    /* Full Screen Storybook Container */
    .storybook-container {
        position: relative;
        width: 100%;
        height: 80vh; 
        border-radius: 2rem;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(244,201,93,0.3);
        background-color: #0f0c29;
        transition: all 0.3s ease;
    }
    
    /* Fix radius when in Fullscreen */
    .storybook-container:fullscreen {
        border-radius: 0;
        height: 100vh;
    }
    .storybook-container:-webkit-full-screen { border-radius: 0; height: 100vh; }
    .storybook-container:-ms-fullscreen { border-radius: 0; height: 100vh; }

    /* 3D Background Image */
    .story-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.6;
        transform: scale(1);
        transition: transform 20s linear;
    }
    .storybook-container.playing .story-bg {
        transform: scale(1.15);
    }

    /* Translucent Text Box */
    .story-text-box {
        position: absolute;
        bottom: 80px; 
        left: 5%;
        right: 5%;
        background: rgba(20, 16, 50, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(139, 92, 246, 0.4);
        border-radius: 1.5rem;
        padding: 1.5rem 2rem;
        text-align: center;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: none; 
    }
    .story-text-box.visible {
        transform: translateY(0);
        opacity: 1;
    }

    .karaoke-text {
        color: #e2e8f0;
        font-size: 1.5rem;
        line-height: 1.6;
        text-shadow: 1px 2px 4px rgba(0,0,0,0.8);
        transition: color 0.3s;
    }
    @media (min-width: 768px) { .karaoke-text { font-size: 2.2rem; } }
    
    .karaoke-text.active-page {
        color: #f4c95d;
        text-shadow: 0 0 15px rgba(244,201,93,0.6);
    }

    /* Top Info Bar */
    .top-bar-overlay {
        position: absolute;
        top: 4%;
        left: 4%;
        right: 4%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
    }

    /* Center Big Play Button */
    #center-play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
        cursor: pointer;
    }

    /* Cinematic Bottom Control Bar */
    .cinematic-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
        padding: 20px 2% 10px 2%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 40;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.4s ease;
    }
    .storybook-container.started .cinematic-controls {
        opacity: 1;
        transform: translateY(0);
    }

    /* Seekable Progress Bar */
    .seek-slider {
        -webkit-appearance: none;
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.2);
        border-radius: 5px;
        outline: none;
        cursor: pointer;
        transition: height 0.2s;
    }
    .seek-slider:hover { height: 8px; }
    .seek-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #f4c95d;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(244, 201, 93, 0.8);
        transition: transform 0.2s;
    }
    .seek-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

    /* Control Buttons */
    .ctrl-btn {
        color: white;
        background: none;
        border: none;
        cursor: pointer;
        transition: color 0.2s, transform 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .ctrl-btn:hover { color: #f4c95d; transform: scale(1.1); }
</style>

<section class="mx-auto max-w-5xl px-4 py-8">
  
  <div class="mb-4 flex justify-between items-center px-2">
    <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-purple-soft hover:text-white transition bg-purple-soft/10 px-4 py-2 rounded-xl border border-purple-soft/30 hover:bg-purple-soft/20">
      ← Library
    </a>
    <h1 class="magical-font text-2xl md:text-3xl font-bold text-white tracking-wide">
        {{ story.title }}
    </h1>
    <div class="w-20"></div> 
  </div>

  <div id="storybook" class="storybook-container">
      
      <img src="{% if story.image_url %}{{ story.image_url }}{% else %}https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop{% endif %}" 
           onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop';" 
           class="story-bg" alt="Magical Background">
      
      <div class="top-bar-overlay">
          <span id="page-indicator" class="bg-black/50 text-gold-soft px-4 py-1.5 rounded-full text-sm font-bold backdrop-blur-sm border border-gold/20 shadow-lg">
              Story Ready
          </span>
      </div>

      <div id="center-play-btn" class="h-24 w-24 rounded-full bg-gold/90 text-navy flex items-center justify-center shadow-[0_0_40px_rgba(244,201,93,0.8)] hover:scale-110 transition-transform duration-300 backdrop-blur-md">
          <svg class="w-12 h-12 ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <div id="text-box" class="story-text-box">
          <p id="dynamic-text" class="magical-font karaoke-text">
              </p>
      </div>

      <div class="cinematic-controls">
          <input type="range" id="seek-bar" class="seek-slider" value="0" max="100" step="0.1">
          
          <div class="flex justify-between items-center px-2 pt-1">
              <div class="flex items-center gap-4">
                  <button id="mini-play-pause" class="ctrl-btn">
                      <svg id="mini-play" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                      <svg id="mini-pause" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                  </button>
                  <span id="time-display" class="text-xs font-bold text-gray-300">0:00 / 0:00</span>
              </div>
              
              <div class="flex items-center gap-6">
                  <button id="skip-back" class="ctrl-btn flex items-center gap-1 text-sm font-bold" title="Rewind 10s">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0019 16V8a1 1 0 00-1.6-.8l-5.333 4zM4.066 11.2a1 1 0 000 1.6l5.334 4A1 1 0 0011 16V8a1 1 0 00-1.6-.8l-5.334 4z"/></svg>
                      -10s
                  </button>
                  <button id="skip-forward" class="ctrl-btn flex items-center gap-1 text-sm font-bold" title="Forward 10s">
                      +10s
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.334-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.334-4z"/></svg>
                  </button>
              </div>

              <div class="flex items-center gap-4">
                  <button id="speed-btn" class="ctrl-btn text-xs font-bold border border-gray-400/50 rounded px-2 py-1 hover:border-gold">1x</button>
                  <button id="fullscreen-btn" class="ctrl-btn" title="Full Screen">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                  </button>
              </div>
          </div>
      </div>
  </div>

  <audio id="story-audio" src="{% if story.audio_data %}data:audio/wav;base64,{{ story.audio_data }}{% endif %}" preload="metadata"></audio>
  <div id="raw-story-content" class="hidden">{{ story.content }}</div>
</section>

<script>
    // 🚀 FIX: Removed the ** Markdown characters so the text looks clean!
    let rawText = document.getElementById('raw-story-content').innerText;
    rawText = rawText.replace(/\*\*/g, ''); // Removes bold stars
    
    const pages = rawText.split(/\n+/).filter(p => p.trim().length > 0);
    const audio = document.getElementById('story-audio');
    
    const storybook = document.getElementById('storybook');
    const centerPlayBtn = document.getElementById('center-play-btn');
    const textBox = document.getElementById('text-box');
    const dynamicText = document.getElementById('dynamic-text');
    const pageIndicator = document.getElementById('page-indicator');
    
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const miniPlayPause = document.getElementById('mini-play-pause');
    const miniPlay = document.getElementById('mini-play');
    const miniPause = document.getElementById('mini-pause');
    const skipBackBtn = document.getElementById('skip-back');
    const skipForwardBtn = document.getElementById('skip-forward');
    const speedBtn = document.getElementById('speed-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    
    let pageTimings = [];
    let currentPageIndex = -1;
    let isStarted = false;

    // Helper: Format Time
    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Prepare Sync Data
    audio.addEventListener('loadedmetadata', () => {
        const totalChars = pages.reduce((sum, p) => sum + p.length, 0);
        let accumulatedTime = 0;
        
        pages.forEach((pageText, index) => {
            const duration = (pageText.length / totalChars) * audio.duration; 
            pageTimings.push({ index, start: accumulatedTime, end: accumulatedTime + duration, text: pageText });
            accumulatedTime += duration;
        });
        timeDisplay.innerText = `0:00 / ${formatTime(audio.duration)}`;
    });

    // Play/Pause Logic
    function togglePlay() {
        if(audio.paused) {
            audio.play();
            storybook.classList.add('playing');
            miniPlay.classList.add('hidden');
            miniPause.classList.remove('hidden');
            
            if(!isStarted) {
                isStarted = true;
                storybook.classList.add('started');
                centerPlayBtn.classList.add('hidden');
                textBox.classList.add('visible');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#f4c95d', '#8b5cf6'] });
            }
        } else {
            audio.pause();
            storybook.classList.remove('playing');
            miniPlay.classList.remove('hidden');
            miniPause.classList.add('hidden');
        }
    }

    centerPlayBtn.addEventListener('click', togglePlay);
    miniPlayPause.addEventListener('click', togglePlay);

    // Sync Text & Update Progress Bar
    audio.addEventListener('timeupdate', () => {
        if(!isNaN(audio.duration)) {
            // Update slider
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.value = progress;
            seekBar.style.background = `linear-gradient(to right, #f4c95d ${progress}%, rgba(255,255,255,0.2) ${progress}%)`;
            timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;

            // Sync Text
            const activePage = pageTimings.find(pt => audio.currentTime >= pt.start && audio.currentTime <= pt.end);
            if (activePage && activePage.index !== currentPageIndex) {
                currentPageIndex = activePage.index;
                textBox.classList.remove('visible');
                setTimeout(() => {
                    dynamicText.innerText = activePage.text;
                    dynamicText.classList.add('active-page');
                    pageIndicator.innerText = `Page ${activePage.index + 1} of ${pages.length}`;
                    textBox.classList.add('visible');
                }, 200); 
            }
        }
    });

    // Seek / Drag Progress Bar
    seekBar.addEventListener('input', () => {
        const seekTime = (seekBar.value / 100) * audio.duration;
        audio.currentTime = seekTime;
    });

    // Skips (10s)
    skipBackBtn.addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    skipForwardBtn.addEventListener('click', () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); });

    // Playback Speed
    let speedIdx = 0;
    const speeds = [1, 1.25, 1.5, 2];
    speedBtn.addEventListener('click', () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        speedBtn.innerText = speeds[speedIdx] + 'x';
    });

    // Fullscreen Toggle
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (storybook.requestFullscreen) { storybook.requestFullscreen(); }
            else if (storybook.webkitRequestFullscreen) { storybook.webkitRequestFullscreen(); } // Safari
            else if (storybook.msRequestFullscreen) { storybook.msRequestFullscreen(); } // IE11
        } else {
            if (document.exitFullscreen) { document.exitFullscreen(); }
            else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            else if (document.msExitFullscreen) { document.msExitFullscreen(); }
        }
    });

    // End State
    audio.addEventListener('ended', () => {
        storybook.classList.remove('playing');
        miniPlay.classList.remove('hidden');
        miniPause.classList.add('hidden');
        textBox.classList.remove('visible');
        setTimeout(() => {
            dynamicText.innerText = "The End ✨";
            textBox.classList.add('visible');
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, colors: ['#f4c95d', '#ffffff'] });
        }, 500);
        currentPageIndex = -1;
    });
</script>
{% endblock %}
