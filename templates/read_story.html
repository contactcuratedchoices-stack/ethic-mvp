{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    /* 🚀 PREMIUM AMBIENT UI - HEADSPACE/CALM STYLE */
    body { background-color: #000000 !important; }
    
    .magical-font { font-family: 'Baloo 2', cursive; }
    .sans-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    .storybook-container {
        position: relative;
        width: 100%;
        height: 85vh; 
        border-radius: 32px;
        overflow: hidden;
        background-color: #050510;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
        transition: all 0.5s ease;
    }
    
    .storybook-container:fullscreen { border-radius: 0; height: 100vh; border: none; }
    .storybook-container:-webkit-full-screen { border-radius: 0; height: 100vh; border: none; }

    /* 🌌 THE AMBIENT AURORA BACKGROUND (Sleep inducing) */
    .ambient-bg {
        position: absolute; inset: -20%; width: 140%; height: 140%;
        background: radial-gradient(circle at 50% 50%, #1a1a3a 0%, #050510 50%),
                    radial-gradient(circle at 80% 20%, rgba(76, 29, 149, 0.4) 0%, transparent 40%),
                    radial-gradient(circle at 20% 80%, rgba(244, 201, 93, 0.15) 0%, transparent 50%);
        background-size: 200% 200%;
        filter: blur(60px);
        animation: auroraFlow 20s ease-in-out infinite alternate;
        z-index: 1;
    }

    @keyframes auroraFlow {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-5%, 5%) scale(1.05); }
        100% { transform: translate(5%, -5%) scale(1); }
    }

    /* ✨ MAGICAL DUST (Slowed down for sleep) */
    .dust-particles {
        position: absolute; inset: 0; pointer-events: none;
        background-image: radial-gradient(circle, rgba(255,255,255,0.4) 1px, transparent 1px);
        background-size: 150px 150px;
        opacity: 0.2; animation: floatDust 40s linear infinite; z-index: 10;
    }
    @keyframes floatDust {
        0% { transform: translateY(0) translateX(0); }
        100% { transform: translateY(-150px) translateX(-50px); }
    }

    /* 🎵 FLOATING KARAOKE LYRICS */
    .story-text-box {
        position: absolute;
        bottom: 25%; left: 5%; right: 5%;
        text-align: center; pointer-events: none; 
        display: flex; justify-content: center; z-index: 35;
    }

    .karaoke-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: rgba(255, 255, 255, 0.3);
        font-size: 1.8rem; font-weight: 800; line-height: 1.4;
        letter-spacing: -0.02em; opacity: 0;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    @media (min-width: 768px) { .karaoke-text { font-size: 2.8rem; } }
    
    .karaoke-highlight { 
        background: linear-gradient(to right, #ffffff, #fce29f);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 15px rgba(244,201,93,0.3));
    }

    @keyframes subtitlePop {
        0% { transform: translateY(15px) scale(0.98); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .reels-text-anim { animation: subtitlePop 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* 🎛️ MINIMALIST CONTROLS */
    .cinematic-controls {
        position: absolute; bottom: 0; left: 0; right: 0; width: 100%;
        background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
        padding: 40px 4% 20px 4%;
        display: flex; flex-direction: column; gap: 12px;
        z-index: 40; opacity: 0; transition: opacity 0.5s ease;
    }
    .storybook-container.started .cinematic-controls { opacity: 1; }
    .storybook-container.idle { cursor: none; }
    .storybook-container.idle .cinematic-controls, .storybook-container.idle .top-bar-overlay { opacity: 0 !important; pointer-events: none; }
    
    .top-bar-overlay { position: absolute; top: 4%; left: 4%; right: 4%; display: flex; justify-content: space-between; z-index: 20; transition: opacity 0.5s ease; }
    
    #center-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; cursor: pointer; transition: all 0.3s ease; }

    .seek-slider {
        -webkit-appearance: none; width: 100%; height: 4px;
        background: rgba(255,255,255,0.1); border-radius: 2px;
        outline: none; cursor: pointer; transition: height 0.1s ease;
    }
    .cinematic-controls:hover .seek-slider { height: 6px; }
    .seek-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none; width: 0px; height: 0px;
        border-radius: 50%; background: #f4c95d; transition: all 0.2s;
    }
    .cinematic-controls:hover .seek-slider::-webkit-slider-thumb { width: 14px; height: 14px; box-shadow: 0 0 15px rgba(244,201,93,0.8); }
    
    .ctrl-btn { color: #ffffff; background: none; border: none; cursor: pointer; opacity: 0.6; transition: all 0.2s; }
    .ctrl-btn:hover { color: #f4c95d; opacity: 1; transform: scale(1.1); }

    /* 🎙️ THE MAGIC MIC (INTERACTIVITY) */
    #magic-mic-container {
        position: absolute; inset: 0; z-index: 50;
        background: rgba(5, 5, 16, 0.85); backdrop-filter: blur(10px);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
    }
    #magic-mic-container.active { opacity: 1; pointer-events: auto; }
    
    .magic-mic-btn {
        width: 100px; height: 100px; border-radius: 50%;
        background: linear-gradient(135deg, #f4c95d, #d4af37);
        display: flex; align-items: center; justify-content: center;
        font-size: 2.5rem; color: #050510; border: none; cursor: pointer;
        box-shadow: 0 0 40px rgba(244, 201, 93, 0.4), inset 0 0 20px rgba(255,255,255,0.5);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .magic-mic-btn:hover { transform: scale(1.1); box-shadow: 0 0 60px rgba(244, 201, 93, 0.8); }
    
    .pulse-ring {
        position: absolute; width: 100px; height: 100px; border-radius: 50%;
        border: 2px solid #f4c95d; animation: micPulse 2s infinite ease-out; pointer-events: none;
    }
    @keyframes micPulse {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
    }
</style>

<section class="w-full min-h-screen bg-black pt-8 pb-12 px-4 flex flex-col items-center">
    
    <div class="w-full max-w-6xl mb-6 flex justify-between items-center z-10 relative">
        <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-gray-400 hover:text-white transition bg-white/5 px-4 py-2.5 rounded-full border border-white/10 hover:bg-white/10 backdrop-blur-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Library
        </a>
        <h1 class="magical-font text-xl md:text-2xl font-bold text-gold-soft tracking-wide">{{ story.title }}</h1>
        <div class="w-24"></div>
    </div>

    <!-- THE AMBIENT AUDIO PLAYER -->
    <div id="storybook" class="storybook-container max-w-6xl w-full">
        <!-- Ambient Art -->
        <div class="ambient-bg"></div>
        <div class="dust-particles"></div>
        
        <div class="top-bar-overlay">
            <span class="bg-white/5 text-gray-300 px-4 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-widest border border-white/10">
                Audio Experience 🎧
            </span>
        </div>

        <div id="center-play-btn" class="h-20 w-20 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center justify-center hover:scale-110 hover:bg-gold hover:border-gold hover:text-navy transition-all duration-300">
            <svg class="w-8 h-8 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <!-- Karaoke Text -->
        <div id="text-box" class="story-text-box">
            <p id="dynamic-text" class="sans-font karaoke-text"></p>
        </div>

        <!-- 🎙️ MAGIC MIC (Appears at the end) -->
        <div id="magic-mic-container">
            <h3 class="magical-font text-3xl md:text-4xl font-bold text-white mb-2 text-center drop-shadow-lg">It's your turn!</h3>
            <p class="text-gray-300 text-sm md:text-base mb-10 max-w-md text-center font-medium">What should happen next? Tap the mic to tell the story.</p>
            
            <div class="relative flex justify-center items-center">
                <div class="pulse-ring"></div>
                <div class="pulse-ring" style="animation-delay: 1s;"></div>
                <button class="magic-mic-btn" onclick="startVoiceInteraction()">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                </button>
            </div>
            
            <p id="mic-status" class="mt-6 text-gold-soft text-xs font-bold uppercase tracking-widest">Tap to Speak</p>
        </div>

        <!-- 🎛️ BOTTOM DOCK CONTROLS -->
        <div class="cinematic-controls">
            <input type="range" id="seek-bar" class="seek-slider" value="0" max="100" step="0.1">
            
            <div class="flex justify-between items-center px-1 pt-3">
                <div class="flex items-center gap-5">
                    <button id="mini-play-pause" class="ctrl-btn">
                        <svg id="mini-play" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="mini-pause" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                    </button>
                    <span id="time-display" class="sans-font text-xs font-bold text-gray-400 tracking-wider">0:00 / 0:00</span>
                </div>
                
                <div class="flex items-center gap-8">
                    <button id="skip-back" class="ctrl-btn text-xs font-bold tracking-wider">-10s</button>
                    <button id="skip-forward" class="ctrl-btn text-xs font-bold tracking-wider">+10s</button>
                </div>
                
                <div class="flex items-center gap-5">
                    <button id="speed-btn" class="ctrl-btn text-xs font-bold border border-white/20 rounded px-2 py-0.5 hover:border-gold">1x</button>
                    <button id="fullscreen-btn" class="ctrl-btn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <audio id="story-audio" src="{% if story.audio_data %}data:audio/wav;base64,{{ story.audio_data }}{% endif %}" preload="metadata"></audio>
    <audio id="bgMusic-audio" loop preload="auto">
        <!-- Very calming frequency music -->
        <source src="https://actions.google.com/sounds/v1/water/rain_on_roof.ogg" type="audio/ogg">
    </audio>

    <div id="raw-story-content" class="hidden">{{ story.content }}</div>
</section>

<script>
    let rawText = document.getElementById('raw-story-content').innerText.replace(/\*\*/g, '');
    const pages = rawText.split(/\n+/).filter(p => p.trim().length > 0);
    const audio = document.getElementById('story-audio');
    const bgMusicAudio = document.getElementById('bgMusic-audio');
    bgMusicAudio.volume = 0.05; 
    
    const storybook = document.getElementById('storybook');
    const centerPlayBtn = document.getElementById('center-play-btn');
    const dynamicText = document.getElementById('dynamic-text');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const miniPlayPause = document.getElementById('mini-play-pause');
    const miniPlay = document.getElementById('mini-play');
    const miniPause = document.getElementById('mini-pause');
    const magicMicContainer = document.getElementById('magic-mic-container');
    
    let subtitleTimings = [];
    let currentSubtitleIndex = -1;
    let isStarted = false;
    let idleTimeout;

    function resetIdleTimer() {
        if(storybook.classList.contains('playing')) {
            storybook.classList.remove('idle');
            clearTimeout(idleTimeout);
            idleTimeout = setTimeout(() => { storybook.classList.add('idle'); }, 2500);
        }
    }
    storybook.addEventListener('mousemove', resetIdleTimer);
    storybook.addEventListener('mouseleave', () => { if(storybook.classList.contains('playing')) storybook.classList.add('idle'); });

    audio.addEventListener('loadedmetadata', () => {
        const totalChars = pages.join(' ').length;
        let accumulatedTime = 0; let chunkIndex = 0;

        pages.forEach((pageText) => {
            let words = pageText.split(/\s+/);
            let chunks = []; let currentChunk = [];

            for(let i = 0; i < words.length; i++) {
                currentChunk.push(words[i]);
                // Shorter chunks for better karaoke syncing
                if(currentChunk.length >= 6 || words[i].match(/[।?!.,|]$/)) {
                    chunks.push(currentChunk.join(' '));
                    currentChunk = [];
                }
            }
            if(currentChunk.length > 0) chunks.push(currentChunk.join(' '));

            chunks.forEach((chunk) => {
                const chunkLength = chunk.length + 1;
                const duration = (chunkLength / totalChars) * audio.duration;
                subtitleTimings.push({ chunkIndex: chunkIndex++, start: accumulatedTime, end: accumulatedTime + duration, text: chunk });
                accumulatedTime += duration;
            });
        });
        timeDisplay.innerText = `0:00 / ${formatTime(audio.duration)}`;
    });

    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60); const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function togglePlay() {
        if(audio.paused) {
            audio.play();
            if(bgMusicAudio.paused) bgMusicAudio.play().catch(e => console.log(e));
            
            storybook.classList.add('playing');
            miniPlay.classList.add('hidden'); miniPause.classList.remove('hidden');
            magicMicContainer.classList.remove('active'); // Hide mic if re-played
            resetIdleTimer();
            
            if(!isStarted) {
                isStarted = true;
                storybook.classList.add('started');
                centerPlayBtn.classList.add('hidden');
            }
        } else {
            audio.pause(); bgMusicAudio.pause();
            storybook.classList.remove('playing', 'idle');
            clearTimeout(idleTimeout);
            miniPlay.classList.remove('hidden'); miniPause.classList.add('hidden');
        }
    }

    storybook.addEventListener('click', (e) => {
        if(e.target.closest('.cinematic-controls') || e.target.closest('.top-bar-overlay') || e.target.closest('#magic-mic-container')) return;
        togglePlay();
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); } 
        else if (e.code === 'ArrowRight') { e.preventDefault(); audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); resetIdleTimer(); } 
        else if (e.code === 'ArrowLeft') { e.preventDefault(); audio.currentTime = Math.max(0, audio.currentTime - 10); resetIdleTimer(); } 
    });

    miniPlayPause.addEventListener('click', togglePlay);

    audio.addEventListener('timeupdate', () => {
        if(!isNaN(audio.duration)) {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.value = progress;
            seekBar.style.background = `linear-gradient(to right, #f4c95d ${progress}%, rgba(255,255,255,0.1) ${progress}%)`;
            timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;

            const activeSubtitle = subtitleTimings.find(st => audio.currentTime >= st.start && audio.currentTime <= st.end);
            
            if (activeSubtitle && activeSubtitle.chunkIndex !== currentSubtitleIndex) {
                currentSubtitleIndex = activeSubtitle.chunkIndex;
                dynamicText.classList.remove('reels-text-anim');
                void dynamicText.offsetWidth; 
                dynamicText.innerHTML = `<span class="karaoke-highlight">${activeSubtitle.text}</span>`;
                dynamicText.classList.add('reels-text-anim');
            }
        }
    });

    seekBar.addEventListener('input', () => { audio.currentTime = (seekBar.value / 100) * audio.duration; resetIdleTimer(); });
    document.getElementById('skip-back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); resetIdleTimer(); });
    document.getElementById('skip-forward').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); resetIdleTimer(); });

    let speedIdx = 0; const speeds = [1, 1.25, 1.5, 2];
    document.getElementById('speed-btn').addEventListener('click', (e) => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        e.target.innerText = speeds[speedIdx] + 'x';
    });

    document.getElementById('fullscreen-btn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (storybook.requestFullscreen) storybook.requestFullscreen();
            else if (storybook.webkitRequestFullscreen) storybook.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });
    
    // 🚀 INTERACTIVITY: Show Magic Mic at the end of the story
    audio.addEventListener('ended', () => {
        bgMusicAudio.pause();
        storybook.classList.remove('playing', 'idle');
        clearTimeout(idleTimeout);
        miniPlay.classList.remove('hidden'); miniPause.classList.add('hidden');
        dynamicText.innerHTML = "";
        
        // Trigger the magical UI
        confetti({ particleCount: 100, spread: 120, origin: { y: 0.6 }, colors: ['#f4c95d', '#8b5cf6'] });
        magicMicContainer.classList.add('active');
    });

    // 🎙️ Placeholder logic for when user taps the mic
    function startVoiceInteraction() {
        const status = document.getElementById('mic-status');
        status.innerText = "Listening... 🟢";
        status.classList.add('text-green-400');
        
        // TODO: In the next phase, we will connect Google/Web Speech API here
        setTimeout(() => {
            status.innerText = "Processing your choice... ✨";
            status.classList.remove('text-green-400');
            status.classList.add('text-purple-400');
        }, 2000);
    }
</script>
{% endblock %}
