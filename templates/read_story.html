{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    /* 🚀 PREMIUM THEATRE UI - NETFLIX STYLE */
    body { background-color: #000000 !important; }
    
    .magical-font { font-family: 'Baloo 2', cursive; }
    .sans-font { font-family: 'Plus Jakarta Sans', sans-serif; }
    
    .storybook-container {
        position: relative;
        width: 100%;
        height: 85vh; 
        border-radius: 24px;
        overflow: hidden;
        background-color: #050510;
        box-shadow: 0 0 50px rgba(244, 201, 93, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.3s ease;
    }
    
    .storybook-container:fullscreen { border-radius: 0; height: 100vh; border: none; }
    .storybook-container:-webkit-full-screen { border-radius: 0; height: 100vh; border: none; }

    /* KEN BURNS ANIMATION */
    .story-bg {
        position: absolute; inset: -5%; width: 110%; height: 110%;
        object-fit: cover; transform: scale(1); transition: opacity 2s ease-in-out;
    }
    @keyframes kenBurns {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.15) translate(-1%, -1%); }
    }
    .storybook-container.playing .story-bg { animation: kenBurns 30s infinite alternate linear; }

    /* 🎬 CINEMATIC LIGHTING OVERLAYS */
    .vignette-overlay {
        position: absolute; inset: 0;
        background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.85) 100%);
        pointer-events: none; z-index: 15;
    }

    /* ✨ MAGICAL DUST */
    .dust-particles {
        position: absolute; inset: 0; pointer-events: none;
        background-image: radial-gradient(circle, rgba(244,201,93,0.8) 1px, transparent 1px),
                          radial-gradient(circle, rgba(244,201,93,0.8) 1px, transparent 1px);
        background-size: 100px 100px; background-position: 0 0, 50px 50px;
        opacity: 0.15; animation: floatDust 20s linear infinite; z-index: 10;
    }
    @keyframes floatDust {
        0% { transform: translateY(0) translateX(0); }
        100% { transform: translateY(-100px) translateX(-50px); }
    }

    /* 🎵 FLOATING LYRICS */
    .story-text-box {
        position: absolute;
        bottom: 20%; 
        left: 5%; right: 5%;
        text-align: center; pointer-events: none; 
        display: flex; justify-content: center; z-index: 35;
    }

    .karaoke-text {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: rgba(255, 255, 255, 0.4);
        font-size: 1.8rem; font-weight: 800; line-height: 1.3;
        letter-spacing: -0.02em; opacity: 0;
        text-shadow: 0 4px 30px rgba(0,0,0,1);
    }
    @media (min-width: 768px) { .karaoke-text { font-size: 3rem; } }
    @media (min-width: 1024px) { .karaoke-text { font-size: 3.5rem; } }
    
    .karaoke-highlight { 
        background: linear-gradient(to right, #ffffff, #fce29f);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
    }

    @keyframes subtitlePop {
        0% { transform: translateY(20px) scale(0.98); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .reels-text-anim { animation: subtitlePop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* 🎛️ NETFLIX STYLE BOTTOM DOCK CONTROLS */
    .cinematic-controls {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        width: 100%;
        background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
        padding: 40px 4% 20px 4%;
        display: flex; flex-direction: column; gap: 12px;
        z-index: 40; opacity: 0;
        transition: opacity 0.5s ease;
    }
    .storybook-container.started .cinematic-controls { opacity: 1; }
    
    /* 👻 IDLE MODE (Auto Hide Cursor and Controls) */
    .storybook-container.idle { cursor: none; }
    .storybook-container.idle .cinematic-controls { opacity: 0 !important; pointer-events: none; }
    .storybook-container.idle .top-bar-overlay { opacity: 0 !important; transition: opacity 0.5s ease; }
    
    .top-bar-overlay { position: absolute; top: 4%; left: 4%; right: 4%; display: flex; justify-content: space-between; z-index: 20; transition: opacity 0.5s ease; }
    
    #center-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; cursor: pointer; transition: all 0.3s ease; }

    /* 🔴 YOUTUBE STYLE SEEK BAR */
    .seek-slider {
        -webkit-appearance: none; width: 100%; height: 4px;
        background: rgba(255,255,255,0.2); border-radius: 2px;
        outline: none; cursor: pointer; transition: height 0.1s ease;
    }
    .cinematic-controls:hover .seek-slider { height: 6px; }
    
    .seek-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 0px; height: 0px;
        border-radius: 50%; background: #f4c95d;
        box-shadow: 0 0 10px rgba(244,201,93,0.5);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cinematic-controls:hover .seek-slider::-webkit-slider-thumb {
        width: 16px; height: 16px;
    }
    
    .ctrl-btn { color: #ffffff; background: none; border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; opacity: 0.7; }
    .ctrl-btn:hover { color: #f4c95d; opacity: 1; transform: scale(1.1); }
</style>

<section class="w-full min-h-screen bg-black pt-8 pb-12 px-4 flex flex-col items-center">
    
    <div class="w-full max-w-6xl mb-6 flex justify-between items-center">
        <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-gray-400 hover:text-white transition bg-white/5 px-4 py-2.5 rounded-full border border-white/10 hover:bg-white/10 backdrop-blur-md">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Library
        </a>
        <h1 class="magical-font text-2xl md:text-3xl font-bold text-white tracking-wide drop-shadow-lg">{{ story.title }}</h1>
        <div class="w-24"></div>
    </div>

    <!-- THE MEDIA PLAYER SCREEN -->
    <div id="storybook" class="storybook-container max-w-6xl w-full">
        <div class="dust-particles"></div>

        <img id="bg-layer-1" class="story-bg opacity-100" src="{{ story.image_url }}" alt="Scene Layer 1">
        <img id="bg-layer-2" class="story-bg opacity-0" src="{{ story.image_url }}" alt="Scene Layer 2">
        
        <div class="vignette-overlay"></div>
        
        <div class="top-bar-overlay">
            <span id="page-indicator" class="bg-black/40 text-gray-200 px-4 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest backdrop-blur-md border border-white/10 shadow-lg">
                Loading Magic...
            </span>
        </div>

        <div id="center-play-btn" class="h-24 w-24 rounded-full bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center justify-center shadow-2xl hover:scale-110 hover:bg-white/20 hover:text-gold transition-all duration-300">
            <svg class="w-10 h-10 ml-2 drop-shadow-lg" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>

        <div id="text-box" class="story-text-box">
            <p id="dynamic-text" class="sans-font karaoke-text"></p>
        </div>

        <!-- 🎛️ BOTTOM DOCK CONTROLS -->
        <div class="cinematic-controls">
            <input type="range" id="seek-bar" class="seek-slider" value="0" max="100" step="0.1">
            
            <div class="flex justify-between items-center px-1 pt-3">
                <div class="flex items-center gap-5">
                    <button id="mini-play-pause" class="ctrl-btn">
                        <svg id="mini-play" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="mini-pause" class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                    </button>
                    <span id="time-display" class="sans-font text-xs font-bold text-gray-400 tracking-wider">0:00 / 0:00</span>
                </div>
                
                <div class="flex items-center gap-8">
                    <button id="skip-back" class="ctrl-btn text-sm font-bold tracking-wider">-10s</button>
                    <button id="skip-forward" class="ctrl-btn text-sm font-bold tracking-wider">+10s</button>
                </div>
                
                <div class="flex items-center gap-5">
                    <button id="speed-btn" class="ctrl-btn text-xs font-bold border border-white/20 rounded px-2.5 py-1 hover:border-gold">1x</button>
                    <button id="fullscreen-btn" class="ctrl-btn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <audio id="story-audio" src="{% if story.audio_data %}data:audio/wav;base64,{{ story.audio_data }}{% endif %}" preload="metadata"></audio>
    <div id="raw-story-content" class="hidden">{{ story.content }}</div>
</section>

<script>
    let rawText = document.getElementById('raw-story-content').innerText;
    rawText = rawText.replace(/\*\*/g, '');
    const pages = rawText.split(/\n+/).filter(p => p.trim().length > 0);
    const audio = document.getElementById('story-audio');
    
    // 🎵 NEW: Background Lullaby Music Setup
    const bgMusic = new Audio('https://cdn.pixabay.com/audio/2022/05/16/audio_b2f9012a68.mp3');
    bgMusic.loop = true;
    bgMusic.volume = 0.08; // Volume level so it doesn't overpower the story voice
    
    const storyTitle = {{ story.title | tojson | safe }}.replace(/[^a-zA-Z0-9\s]/g, ' ').trim();

    const storyImages = pages.map((pageText, index) => {
        let randomSeed = Math.floor(Math.random() * 9999999);
        let cleanText = pageText.replace(/["'\\\n\r]/g, ' ').substring(0, 80);
        let imagePrompt = `Ultra-detailed 3D CGI Pixar style masterpiece, ${cleanText}, vibrant colors, extremely cute, perfect symmetric face, glowing cinematic lighting, 8k resolution`;
        return `https://image.pollinations.ai/prompt/${encodeURIComponent(imagePrompt)}?width=1280&height=720&nologo=true&model=flux&seed=${randomSeed}`;
    });

    async function preloadImagesSequentially() {
        for (let i = 0; i < storyImages.length; i++) {
            await new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve();
                img.onerror = () => {
                    storyImages[i] = "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop";
                    resolve();
                };
                img.src = storyImages[i];
            });
            await new Promise(r => setTimeout(r, 500));
        }
    }
    preloadImagesSequentially();

    const bgLayer1 = document.getElementById('bg-layer-1');
    const bgLayer2 = document.getElementById('bg-layer-2');
    let activeLayer = 1;
    
    const storybook = document.getElementById('storybook');
    const centerPlayBtn = document.getElementById('center-play-btn');
    const dynamicText = document.getElementById('dynamic-text');
    const pageIndicator = document.getElementById('page-indicator');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const miniPlayPause = document.getElementById('mini-play-pause');
    const miniPlay = document.getElementById('mini-play');
    const miniPause = document.getElementById('mini-pause');
    
    let subtitleTimings = [];
    let currentSubtitleIndex = -1;
    let currentPageIndex = -1;
    let isStarted = false;
    let idleTimeout;

    // 🚀 NEW: Netflix Style Auto-Hide Logic
    function resetIdleTimer() {
        if(storybook.classList.contains('playing')) {
            storybook.classList.remove('idle');
            clearTimeout(idleTimeout);
            idleTimeout = setTimeout(() => {
                storybook.classList.add('idle');
            }, 3000); // 3 seconds of inactivity
        }
    }
    storybook.addEventListener('mousemove', resetIdleTimer);
    storybook.addEventListener('mouseleave', () => {
        if(storybook.classList.contains('playing')) storybook.classList.add('idle');
    });

    audio.addEventListener('loadedmetadata', () => {
        const totalChars = pages.join(' ').length;
        let accumulatedTime = 0;
        let chunkIndex = 0;

        pages.forEach((pageText, pageIndex) => {
            let words = pageText.split(/\s+/);
            let chunks = [];
            let currentChunk = [];

            for(let i = 0; i < words.length; i++) {
                currentChunk.push(words[i]);
                if(currentChunk.length >= 7 || words[i].match(/[।?!.,|]$/)) {
                    chunks.push(currentChunk.join(' '));
                    currentChunk = [];
                }
            }
            if(currentChunk.length > 0) chunks.push(currentChunk.join(' '));

            chunks.forEach((chunk) => {
                const chunkLength = chunk.length + 1;
                const duration = (chunkLength / totalChars) * audio.duration;
                subtitleTimings.push({ chunkIndex: chunkIndex++, pageIndex: pageIndex, start: accumulatedTime, end: accumulatedTime + duration, text: chunk });
                accumulatedTime += duration;
            });
        });
        
        timeDisplay.innerText = `0:00 / ${formatTime(audio.duration)}`;
        pageIndicator.innerText = "Ready to Play 🎬";
    });

    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function changeSceneImage(imageSrc) {
        if (activeLayer === 1) {
            bgLayer2.src = imageSrc;
            bgLayer2.classList.remove('opacity-0'); bgLayer2.classList.add('opacity-100');
            bgLayer1.classList.remove('opacity-100'); bgLayer1.classList.add('opacity-0');
            activeLayer = 2;
        } else {
            bgLayer1.src = imageSrc;
            bgLayer1.classList.remove('opacity-0'); bgLayer1.classList.add('opacity-100');
            bgLayer2.classList.remove('opacity-100'); bgLayer2.classList.add('opacity-0');
            activeLayer = 1;
        }
    }

    // 🚀 MODIFIED: Toggles main audio AND background music together
    function togglePlay() {
        if(audio.paused) {
            audio.play();
            bgMusic.play().catch(e => console.log("Background music autoplay prevented by browser")); // Play BG Music
            storybook.classList.add('playing');
            miniPlay.classList.add('hidden');
            miniPause.classList.remove('hidden');
            resetIdleTimer();
            
            if(!isStarted) {
                isStarted = true;
                storybook.classList.add('started');
                centerPlayBtn.classList.add('hidden');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        } else {
            audio.pause();
            bgMusic.pause(); // Pause BG Music
            storybook.classList.remove('playing');
            storybook.classList.remove('idle'); // Show controls when paused
            clearTimeout(idleTimeout);
            miniPlay.classList.remove('hidden');
            miniPause.classList.add('hidden');
        }
    }

    storybook.addEventListener('click', (e) => {
        // Prevent click if clicking on the control bar or top bar
        if(e.target.closest('.cinematic-controls') || e.target.closest('.top-bar-overlay')) return;
        togglePlay();
    });
    
    document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault(); 
            togglePlay();
        } else if (e.code === 'ArrowRight') {
            e.preventDefault();
            audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
            resetIdleTimer();
        } else if (e.code === 'ArrowLeft') {
            e.preventDefault();
            audio.currentTime = Math.max(0, audio.currentTime - 10);
            resetIdleTimer();
        } else if (e.code === 'KeyF') {
            e.preventDefault();
            toggleFullscreen();
        }
    });

    miniPlayPause.addEventListener('click', togglePlay);

    audio.addEventListener('timeupdate', () => {
        if(!isNaN(audio.duration)) {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.value = progress;
            seekBar.style.background = `linear-gradient(to right, #f4c95d ${progress}%, rgba(255,255,255,0.2) ${progress}%)`;
            timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;

            const activeSubtitle = subtitleTimings.find(st => audio.currentTime >= st.start && audio.currentTime <= st.end);
            
            if (activeSubtitle && activeSubtitle.chunkIndex !== currentSubtitleIndex) {
                currentSubtitleIndex = activeSubtitle.chunkIndex;
                
                if (activeSubtitle.pageIndex !== currentPageIndex) {
                    currentPageIndex = activeSubtitle.pageIndex;
                    if(storyImages[currentPageIndex]) changeSceneImage(storyImages[currentPageIndex]);
                    pageIndicator.innerText = `Scene ${currentPageIndex + 1} of ${pages.length}`;
                }

                dynamicText.classList.remove('reels-text-anim');
                void dynamicText.offsetWidth; 
                
                dynamicText.innerHTML = `<span class="karaoke-highlight">${activeSubtitle.text}</span>`;
                dynamicText.classList.add('reels-text-anim');
            }
        }
    });

    seekBar.addEventListener('input', () => { 
        audio.currentTime = (seekBar.value / 100) * audio.duration; 
        resetIdleTimer();
    });
    document.getElementById('skip-back').addEventListener('click', () => { 
        audio.currentTime = Math.max(0, audio.currentTime - 10); 
        resetIdleTimer();
    });
    document.getElementById('skip-forward').addEventListener('click', () => { 
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); 
        resetIdleTimer();
    });

    let speedIdx = 0; const speeds = [1, 1.25, 1.5, 2];
    document.getElementById('speed-btn').addEventListener('click', (e) => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        e.target.innerText = speeds[speedIdx] + 'x';
    });

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            if (storybook.requestFullscreen) storybook.requestFullscreen();
            else if (storybook.webkitRequestFullscreen) storybook.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
    
    // 🚀 MODIFIED: Stop background music when story ends
    audio.addEventListener('ended', () => {
        bgMusic.pause(); // Stop background music
        bgMusic.currentTime = 0; // Reset it to beginning
        
        storybook.classList.remove('playing');
        storybook.classList.remove('idle');
        clearTimeout(idleTimeout);
        miniPlay.classList.remove('hidden');
        miniPause.classList.add('hidden');
        dynamicText.classList.remove('reels-text-anim');
        dynamicText.innerText = "The End ✨";
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, colors: ['#f4c95d', '#ffffff'] });
        currentSubtitleIndex = -1;
    });
</script>
{% endblock %}
