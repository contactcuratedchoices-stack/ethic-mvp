{% extends "base.html" %}

{% block content %}
<section class="mx-auto max-w-3xl px-5 py-12 md:py-20">
  <div class="glass rounded-3xl p-8 shadow-2xl sm:p-12 relative overflow-hidden">
    
    <!-- Decorative Glow -->
    <div class="absolute -top-20 -left-20 w-64 h-64 bg-gold/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Back Button -->
    <div class="mb-8 relative z-10 flex justify-between items-center">
      <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-purple-soft hover:text-white transition bg-purple-soft/10 px-4 py-2 rounded-lg border border-purple-soft/20">
        ← Back to Library
      </a>
    </div>

    <!-- Story Header -->
    <div class="text-center relative z-10 border-b border-purple-soft/20 pb-8 mb-8">
      <span class="inline-block px-3 py-1 bg-gold/15 text-gold text-xs uppercase tracking-wider font-bold rounded-md mb-4 border border-gold/30 shadow-gold">
        Value: {{ story.moral }}
      </span>
      <h1 class="font-serif text-3xl md:text-5xl font-bold text-white leading-tight mb-4">{{ story.title }}</h1>
      <p class="text-sm text-muted">Created on {{ story.created_at.strftime('%B %d, %Y') }}</p>
    </div>

    <!-- 🚀 UPDATED: AUDIO PLAYER (Only shows if audio exists) -->
    {% if story.audio_data %}
    <div class="relative z-10 mb-10 mx-auto max-w-lg rounded-2xl border border-purple-soft/30 bg-navy/80 p-4 shadow-xl">
      <div class="flex items-center gap-4">
        <audio id="saved-audio-player" src="data:audio/mpeg;base64,{{ story.audio_data }}" class="hidden"></audio>
        
        <button id="play-btn" class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-gold text-navy shadow-gold transition hover:brightness-105">
          <svg id="icon-play" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        
        <div id="waveform" class="flex h-10 flex-1 items-center gap-[3px]"></div>
        
        <button id="speed-btn" class="rounded-lg bg-gold/15 border border-gold/30 px-3 py-1.5 text-xs font-bold text-gold hover:bg-gold/30 transition">1x</button>
      </div>
    </div>
    
    <script>
      // Audio Player Logic for Saved Story
      const wf = document.getElementById('waveform');
      let bars = '';
      for (let i = 0; i < 30; i++) {
        const h = (20 + Math.abs(Math.sin(i * 0.9)) * 80).toFixed(2);
        bars += `<span style="display:block;width:3px;border-radius:9999px;background:#f4c95d;height:${h}%;opacity:.6;animation-delay:${(i * 0.05).toFixed(2)}s"></span>`;
      }
      if(wf) wf.innerHTML = bars;

      const audioEl = document.getElementById('saved-audio-player');
      const playBtn = document.getElementById('play-btn');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const speedBtn = document.getElementById('speed-btn');

      if(playBtn && audioEl) {
        playBtn.addEventListener('click', () => {
          if (audioEl.paused) { audioEl.play(); iconPlay.classList.add('hidden'); iconPause.classList.remove('hidden'); } 
          else { audioEl.pause(); iconPause.classList.add('hidden'); iconPlay.classList.remove('hidden'); }
        });
        audioEl.addEventListener('ended', () => { iconPause.classList.add('hidden'); iconPlay.classList.remove('hidden'); });

        let speedIdx = 0; const speeds = [1, 1.25, 1.5, 2];
        speedBtn.addEventListener('click', () => { 
          speedIdx = (speedIdx + 1) % speeds.length; 
          audioEl.playbackRate = speeds[speedIdx]; 
          speedBtn.innerText = speeds[speedIdx] + 'x'; 
        });
      }
    </script>
    {% endif %}

    <!-- Story Content -->
    <div class="relative z-10 text-lg leading-relaxed text-gray-300 font-medium whitespace-pre-wrap text-pretty space-y-6">
      {{ story.content }}
    </div>

  </div>
</section>
{% endblock %}
