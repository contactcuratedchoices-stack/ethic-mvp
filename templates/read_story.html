{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    .magical-font { font-family: 'Baloo 2', cursive; }
    
    /* Full Screen Storybook Container */
    .storybook-container {
        position: relative;
        width: 100%;
        height: 85vh; /* Takes most of the screen */
        border-radius: 2rem;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(244,201,93,0.3);
        background-color: #0f0c29;
    }

    /* 3D Background Image with Ken Burns (Zoom) Effect */
    .story-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.6;
        transform: scale(1);
        transition: transform 20s linear; /* Slow zoom effect */
    }
    .storybook-container.playing .story-bg {
        transform: scale(1.15);
    }

    /* Translucent Text Box at the bottom */
    .story-text-box {
        position: absolute;
        bottom: 5%;
        left: 5%;
        right: 5%;
        background: rgba(20, 16, 50, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(139, 92, 246, 0.4);
        border-radius: 1.5rem;
        padding: 1.5rem 2rem;
        text-align: center;
        box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        transform: translateY(20px);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .story-text-box.visible {
        transform: translateY(0);
        opacity: 1;
    }

    /* Karaoke Text Style */
    .karaoke-text {
        color: #e2e8f0;
        font-size: 1.5rem;
        line-height: 1.6;
        text-shadow: 1px 2px 4px rgba(0,0,0,0.8);
    }
    @media (min-width: 768px) {
        .karaoke-text { font-size: 2.2rem; }
    }
    
    /* Highlighting active text */
    .karaoke-text.active-page {
        color: #f4c95d; /* Gold */
        text-shadow: 0 0 15px rgba(244,201,93,0.6);
    }

    /* Controls Overlay */
    .controls-overlay {
        position: absolute;
        top: 5%;
        left: 5%;
        right: 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
    }

    /* Play Button Floating in center before start */
    #center-play-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 30;
        cursor: pointer;
    }

    /* Progress bar */
    .progress-container {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.1);
    }
    .progress-bar {
        height: 100%;
        background: #f4c95d;
        width: 0%;
        box-shadow: 0 0 10px #f4c95d;
        transition: width 0.1s linear;
    }
</style>

<section class="mx-auto max-w-5xl px-4 py-8">
  
  <div class="mb-6 flex justify-between items-center px-2">
    <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-purple-soft hover:text-white transition bg-purple-soft/10 px-4 py-2 rounded-xl border border-purple-soft/30 hover:bg-purple-soft/20">
      ← Library
    </a>
    <h1 class="magical-font text-2xl md:text-3xl font-bold text-white tracking-wide">
        {{ story.title }}
    </h1>
    <div class="w-20"></div> </div>

  <div id="storybook" class="storybook-container">
      
      <img src="https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop" class="story-bg" alt="Magical Background">
      
      <div class="controls-overlay">
          <span id="page-indicator" class="bg-black/50 text-gold-soft px-4 py-1.5 rounded-full text-sm font-bold backdrop-blur-sm border border-gold/20">
              Page 1
          </span>
          <button id="top-pause-btn" class="hidden bg-black/50 text-white px-4 py-2 rounded-full text-sm font-bold backdrop-blur-sm border border-white/20 hover:bg-white/20 transition">
              ⏸ Pause
          </button>
      </div>

      <div id="center-play-btn" class="h-24 w-24 rounded-full bg-gold/90 text-navy flex items-center justify-center shadow-[0_0_40px_rgba(244,201,93,0.8)] hover:scale-110 transition-transform duration-300 backdrop-blur-md">
          <svg class="w-12 h-12 ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <div id="text-box" class="story-text-box">
          <p id="dynamic-text" class="magical-font karaoke-text">
              </p>
      </div>

      <div class="progress-container">
          <div id="progress-bar" class="progress-bar"></div>
      </div>
      
  </div>

  <audio id="story-audio" src="{% if story.audio_data %}data:audio/wav;base64,{{ story.audio_data }}{% endif %}" preload="metadata"></audio>
  <div id="raw-story-content" class="hidden">{{ story.content }}</div>

</section>

<script>
    // 1. Setup Data
    const rawText = document.getElementById('raw-story-content').innerText;
    const pages = rawText.split(/\n+/).filter(p => p.trim().length > 0);
    const audio = document.getElementById('story-audio');
    
    // UI Elements
    const storybook = document.getElementById('storybook');
    const centerPlayBtn = document.getElementById('center-play-btn');
    const topPauseBtn = document.getElementById('top-pause-btn');
    const textBox = document.getElementById('text-box');
    const dynamicText = document.getElementById('dynamic-text');
    const pageIndicator = document.getElementById('page-indicator');
    const progressBar = document.getElementById('progress-bar');
    
    let pageTimings = [];
    let currentPageIndex = -1;

    // 2. The Smart Sync Algorithm (Calculates time per page based on text length)
    audio.addEventListener('loadedmetadata', () => {
        const totalChars = pages.reduce((sum, p) => sum + p.length, 0);
        const totalDuration = audio.duration;
        let accumulatedTime = 0;

        pages.forEach((pageText, index) => {
            // Give slightly more time to commas and periods if you want, but raw length is very accurate for AI voices!
            const duration = (pageText.length / totalChars) * totalDuration; 
            pageTimings.push({
                index: index,
                start: accumulatedTime,
                end: accumulatedTime + duration,
                text: pageText
            });
            accumulatedTime += duration;
        });
    });

    // 3. Play / Pause Actions
    function startMagic() {
        if(pages.length === 0 || !audio.src) {
            alert("No story or audio found!");
            return;
        }
        
        audio.play();
        centerPlayBtn.classList.add('hidden');
        topPauseBtn.classList.remove('hidden');
        storybook.classList.add('playing'); // Triggers Image Zoom
        textBox.classList.add('visible');
        
        // Confetti on Start
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#f4c95d', '#8b5cf6'] });
    }

    function pauseMagic() {
        audio.pause();
        centerPlayBtn.classList.remove('hidden');
        topPauseBtn.classList.add('hidden');
        storybook.classList.remove('playing');
    }

    centerPlayBtn.addEventListener('click', startMagic);
    topPauseBtn.addEventListener('click', pauseMagic);

    // 4. Core Engine: Checking Time and Auto-Flipping Pages
    audio.addEventListener('timeupdate', () => {
        const currTime = audio.currentTime;
        
        // Update Bottom Progress Bar
        const progress = (currTime / audio.duration) * 100;
        progressBar.style.width = progress + '%';

        // Find which page we are currently on
        const activePage = pageTimings.find(pt => currTime >= pt.start && currTime <= pt.end);

        if (activePage && activePage.index !== currentPageIndex) {
            // PAGE FLIP DETECTED!
            currentPageIndex = activePage.index;
            
            // UI Update: Hide text briefly, change it, show it again (Smooth Transition)
            textBox.classList.remove('visible');
            setTimeout(() => {
                dynamicText.innerText = activePage.text;
                // Add magical glow class
                dynamicText.classList.add('active-page');
                pageIndicator.innerText = `Page ${activePage.index + 1} of ${pages.length}`;
                textBox.classList.add('visible');
            }, 300); // 300ms fade
        }
    });

    // 5. When Story Ends
    audio.addEventListener('ended', () => {
        pauseMagic();
        textBox.classList.remove('visible');
        setTimeout(() => {
            dynamicText.innerText = "The End ✨";
            textBox.classList.add('visible');
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, colors: ['#f4c95d', '#ffffff'] });
        }, 500);
        currentPageIndex = -1; // Reset
    });
</script>
{% endblock %}
