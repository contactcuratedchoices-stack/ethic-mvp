{% extends "base.html" %}

{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
    .magical-font { font-family: 'Baloo 2', cursive; }
    
    .storybook-container {
        position: relative;
        width: 100%;
        height: 85vh; 
        border-radius: 2rem;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 2px rgba(244,201,93,0.4);
        background-color: #050510;
        transition: all 0.3s ease;
    }
    
    .storybook-container:fullscreen { border-radius: 0; height: 100vh; }
    .storybook-container:-webkit-full-screen { border-radius: 0; height: 100vh; }

    /* KEN BURNS DUAL LAYER CROSSFADE */
    .story-bg {
        position: absolute;
        inset: -5%; /* Thoda extra space zoom ke liye */
        width: 110%;
        height: 110%;
        object-fit: cover;
        transform: scale(1);
        transition: opacity 2s ease-in-out;
    }
    
    /* Smooth Zoom Animation */
    @keyframes kenBurns {
        0% { transform: scale(1) translate(0, 0); }
        100% { transform: scale(1.15) translate(-1%, -1%); }
    }
    .storybook-container.playing .story-bg {
        animation: kenBurns 30s infinite alternate linear;
    }

    /* 🚀 MAGICAL DUST PARTICLES */
    .dust-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: 
            radial-gradient(circle, rgba(244,201,93,0.8) 1px, transparent 1px),
            radial-gradient(circle, rgba(244,201,93,0.8) 1px, transparent 1px);
        background-size: 100px 100px;
        background-position: 0 0, 50px 50px;
        opacity: 0.3;
        animation: floatDust 20s linear infinite;
        z-index: 10;
    }
    @keyframes floatDust {
        0% { transform: translateY(0) translateX(0); }
        100% { transform: translateY(-100px) translateX(-50px); }
    }

    /* PREMIUM SUBTITLE BOX */
    .story-text-box {
        position: absolute;
        bottom: 12%; 
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 900px;
        text-align: center;
        pointer-events: none; 
        display: flex;
        justify-content: center;
        z-index: 35;
    }

    .karaoke-text {
        color: #ffffff;
        font-size: 1.8rem;
        font-weight: 700;
        line-height: 1.5;
        background: rgba(10, 10, 20, 0.65);
        backdrop-filter: blur(10px);
        padding: 15px 30px;
        border-radius: 25px;
        border: 1px solid rgba(244, 201, 93, 0.3);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 0 0 15px rgba(244, 201, 93, 0.1);
        display: inline-block;
        opacity: 0;
    }
    @media (min-width: 768px) { .karaoke-text { font-size: 2.4rem; } }
    
    .karaoke-highlight { 
        color: #f4c95d; 
        text-shadow: 0 0 15px rgba(244,201,93,0.6);
    }

    @keyframes subtitlePop {
        0% { transform: translateY(15px) scale(0.95); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .reels-text-anim {
        animation: subtitlePop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Cinematic Controls */
    .cinematic-controls {
        position: absolute;
        bottom: 0; left: 0; width: 100%;
        background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0));
        padding: 25px 3% 15px 3%;
        display: flex; flex-direction: column; gap: 12px;
        z-index: 40; opacity: 0; transform: translateY(10px);
        transition: all 0.4s ease;
    }
    .storybook-container.started .cinematic-controls {
        opacity: 1; transform: translateY(0);
    }
    
    .top-bar-overlay { position: absolute; top: 4%; left: 4%; right: 4%; display: flex; justify-content: space-between; z-index: 20; }
    #center-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30; cursor: pointer; }

    .seek-slider { -webkit-appearance: none; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 5px; outline: none; cursor: pointer; transition: height 0.2s; }
    .seek-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #f4c95d; cursor: pointer; box-shadow: 0 0 10px rgba(244, 201, 93, 0.8); }
    .ctrl-btn { color: white; background: none; border: none; cursor: pointer; transition: color 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:hover { color: #f4c95d; transform: scale(1.1); }
</style>

<section class="mx-auto max-w-5xl px-4 py-8">
  <div class="mb-4 flex justify-between items-center px-2">
    <a href="/dashboard" class="inline-flex items-center gap-2 text-sm font-bold text-purple-soft hover:text-white transition bg-purple-soft/10 px-4 py-2 rounded-xl border border-purple-soft/30 hover:bg-purple-soft/20">
      ← Library
    </a>
    <h1 class="magical-font text-2xl md:text-3xl font-bold text-white tracking-wide">{{ story.title }}</h1>
    <div class="w-20"></div> 
  </div>

  <div id="storybook" class="storybook-container">
      <div class="dust-particles"></div>

      <img id="bg-layer-1" class="story-bg opacity-100" src="{{ story.image_url }}" alt="Scene Layer 1">
      <img id="bg-layer-2" class="story-bg opacity-0" src="{{ story.image_url }}" alt="Scene Layer 2">
      
      <div class="top-bar-overlay">
          <span id="page-indicator" class="bg-black/60 text-gold-soft px-4 py-1.5 rounded-full text-sm font-bold backdrop-blur-md border border-gold/30 shadow-lg">
              Loading Magic...
          </span>
      </div>

      <div id="center-play-btn" class="h-24 w-24 rounded-full bg-gold/90 text-navy flex items-center justify-center shadow-[0_0_40px_rgba(244,201,93,0.8)] hover:scale-110 transition-transform duration-300">
          <svg class="w-12 h-12 ml-2" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <div id="text-box" class="story-text-box">
          <p id="dynamic-text" class="magical-font karaoke-text"></p>
      </div>

      <div class="cinematic-controls">
          <input type="range" id="seek-bar" class="seek-slider" value="0" max="100" step="0.1">
          <div class="flex justify-between items-center px-2 pt-1">
              <div class="flex items-center gap-4">
                  <button id="mini-play-pause" class="ctrl-btn">
                      <svg id="mini-play" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                      <svg id="mini-pause" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
                  </button>
                  <span id="time-display" class="text-xs font-bold text-gray-300">0:00 / 0:00</span>
              </div>
              <div class="flex items-center gap-6">
                  <button id="skip-back" class="ctrl-btn text-sm font-bold">-10s</button>
                  <button id="skip-forward" class="ctrl-btn text-sm font-bold">+10s</button>
              </div>
              <div class="flex items-center gap-4">
                  <button id="speed-btn" class="ctrl-btn text-xs font-bold border border-gray-400/50 rounded px-2 py-1">1x</button>
                  <button id="fullscreen-btn" class="ctrl-btn">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                  </button>
              </div>
          </div>
      </div>
  </div>

  <audio id="story-audio" src="{% if story.audio_data %}data:audio/wav;base64,{{ story.audio_data }}{% endif %}" preload="metadata"></audio>
  <div id="raw-story-content" class="hidden">{{ story.content }}</div>
</section>

<script>
    let rawText = document.getElementById('raw-story-content').innerText;
    rawText = rawText.replace(/\*\*/g, '');
    const pages = rawText.split(/\n+/).filter(p => p.trim().length > 0);
    const audio = document.getElementById('story-audio');
    
    const storyTitle = {{ story.title | tojson | safe }}.replace(/[^a-zA-Z0-9\s]/g, ' ').trim();

    // Generate URLs
    const storyImages = pages.map((pageText, index) => {
        let randomSeed = Math.floor(Math.random() * 9999999);
        let cleanText = pageText.replace(/["'\\\n\r]/g, ' ').substring(0, 80);
        let imagePrompt = `Ultra-detailed 3D CGI Pixar style masterpiece, ${cleanText}, vibrant colors, extremely cute, perfect symmetric face, glowing cinematic lighting, 8k resolution`;
        return `https://image.pollinations.ai/prompt/${encodeURIComponent(imagePrompt)}?width=1280&height=720&nologo=true&model=flux&seed=${randomSeed}`;
    });

    // 🚀 NEW: SEQUENTIAL LAZY LOADER (Black Screen Bug Fix)
    // Ek saath sab load nahi karenge. Pehle 2 load karenge, fir baaki dheere-dheere.
    async function preloadImagesSequentially() {
        for (let i = 0; i < storyImages.length; i++) {
            await new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve();
                img.onerror = () => {
                    // Agar API block karde, toh default magical image dikhayega (black nahi hoga)
                    storyImages[i] = "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=2094&auto=format&fit=crop";
                    resolve();
                };
                img.src = storyImages[i];
            });
            // Har image ke baad 500ms ka gap taaki API gussa na ho
            await new Promise(r => setTimeout(r, 500));
        }
    }
    preloadImagesSequentially();

    const bgLayer1 = document.getElementById('bg-layer-1');
    const bgLayer2 = document.getElementById('bg-layer-2');
    let activeLayer = 1;
    
    const storybook = document.getElementById('storybook');
    const centerPlayBtn = document.getElementById('center-play-btn');
    const dynamicText = document.getElementById('dynamic-text');
    const pageIndicator = document.getElementById('page-indicator');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');
    const miniPlayPause = document.getElementById('mini-play-pause');
    const miniPlay = document.getElementById('mini-play');
    const miniPause = document.getElementById('mini-pause');
    
    let subtitleTimings = [];
    let currentSubtitleIndex = -1;
    let currentPageIndex = -1;
    let isStarted = false;

    audio.addEventListener('loadedmetadata', () => {
        const totalChars = pages.join(' ').length;
        let accumulatedTime = 0;
        let chunkIndex = 0;

        pages.forEach((pageText, pageIndex) => {
            let words = pageText.split(/\s+/);
            let chunks = [];
            let currentChunk = [];

            for(let i = 0; i < words.length; i++) {
                currentChunk.push(words[i]);
                if(currentChunk.length >= 7 || words[i].match(/[।?!.,|]$/)) {
                    chunks.push(currentChunk.join(' '));
                    currentChunk = [];
                }
            }
            if(currentChunk.length > 0) chunks.push(currentChunk.join(' '));

            chunks.forEach((chunk) => {
                const chunkLength = chunk.length + 1;
                const duration = (chunkLength / totalChars) * audio.duration;
                subtitleTimings.push({ chunkIndex: chunkIndex++, pageIndex: pageIndex, start: accumulatedTime, end: accumulatedTime + duration, text: chunk });
                accumulatedTime += duration;
            });
        });
        
        timeDisplay.innerText = `0:00 / ${formatTime(audio.duration)}`;
        pageIndicator.innerText = "Ready to Play 🎬";
    });

    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function changeSceneImage(imageSrc) {
        if (activeLayer === 1) {
            bgLayer2.src = imageSrc;
            bgLayer2.classList.remove('opacity-0');
            bgLayer2.classList.add('opacity-100');
            bgLayer1.classList.remove('opacity-100');
            bgLayer1.classList.add('opacity-0');
            activeLayer = 2;
        } else {
            bgLayer1.src = imageSrc;
            bgLayer1.classList.remove('opacity-0');
            bgLayer1.classList.add('opacity-100');
            bgLayer2.classList.remove('opacity-100');
            bgLayer2.classList.add('opacity-0');
            activeLayer = 1;
        }
    }

    function togglePlay() {
        if(audio.paused) {
            audio.play();
            storybook.classList.add('playing');
            miniPlay.classList.add('hidden');
            miniPause.classList.remove('hidden');
            
            if(!isStarted) {
                isStarted = true;
                storybook.classList.add('started');
                centerPlayBtn.classList.add('hidden');
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        } else {
            audio.pause();
            storybook.classList.remove('playing');
            miniPlay.classList.remove('hidden');
            miniPause.classList.add('hidden');
        }
    }
    centerPlayBtn.addEventListener('click', togglePlay);
    miniPlayPause.addEventListener('click', togglePlay);

    audio.addEventListener('timeupdate', () => {
        if(!isNaN(audio.duration)) {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekBar.value = progress;
            seekBar.style.background = `linear-gradient(to right, #f4c95d ${progress}%, rgba(255,255,255,0.2) ${progress}%)`;
            timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;

            const activeSubtitle = subtitleTimings.find(st => audio.currentTime >= st.start && audio.currentTime <= st.end);
            
            if (activeSubtitle && activeSubtitle.chunkIndex !== currentSubtitleIndex) {
                currentSubtitleIndex = activeSubtitle.chunkIndex;
                
                if (activeSubtitle.pageIndex !== currentPageIndex) {
                    currentPageIndex = activeSubtitle.pageIndex;
                    if(storyImages[currentPageIndex]) changeSceneImage(storyImages[currentPageIndex]);
                    pageIndicator.innerText = `Scene ${currentPageIndex + 1} of ${pages.length}`;
                }

                dynamicText.classList.remove('reels-text-anim');
                void dynamicText.offsetWidth; 
                
                dynamicText.innerHTML = `<span class="karaoke-highlight">${activeSubtitle.text}</span>`;
                dynamicText.classList.add('reels-text-anim');
            }
        }
    });

    seekBar.addEventListener('input', () => { audio.currentTime = (seekBar.value / 100) * audio.duration; });
    document.getElementById('skip-back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    document.getElementById('skip-forward').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); });

    let speedIdx = 0; const speeds = [1, 1.25, 1.5, 2];
    document.getElementById('speed-btn').addEventListener('click', (e) => {
        speedIdx = (speedIdx + 1) % speeds.length;
        audio.playbackRate = speeds[speedIdx];
        e.target.innerText = speeds[speedIdx] + 'x';
    });

    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (storybook.requestFullscreen) storybook.requestFullscreen();
            else if (storybook.webkitRequestFullscreen) storybook.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    });
    
    audio.addEventListener('ended', () => {
        storybook.classList.remove('playing');
        miniPlay.classList.remove('hidden');
        miniPause.classList.add('hidden');
        dynamicText.classList.remove('reels-text-anim');
        dynamicText.innerText = "The End ✨";
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, colors: ['#f4c95d', '#ffffff'] });
        currentSubtitleIndex = -1;
    });
</script>
{% endblock %}
