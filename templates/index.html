<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETHIC - Magical AI Stories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Magical Theme Colors */
        body { 
            background: linear-gradient(135deg, #0f172a, #3b0764); 
            color: white; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .glow-btn { 
            background: #fbbf24; 
            color: #1e3a8a; 
            font-weight: bold; 
            box-shadow: 0 0 15px #fbbf24; 
            transition: all 0.3s ease; 
        }
        .glow-btn:hover { 
            box-shadow: 0 0 25px #f59e0b; 
            transform: scale(1.02); 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
    </style>
</head>
<body class="p-6 md:p-12">
    
    <header class="mb-12 text-center md:text-left">
        <h1 class="text-4xl font-extrabold tracking-widest text-yellow-400 drop-shadow-lg">ETHIC ✨</h1>
    </header>

    <main class="max-w-5xl mx-auto flex flex-col md:flex-row gap-12 items-center">
        
        <div class="flex-1 text-center md:text-left">
            <h2 class="text-4xl md:text-5xl font-bold mb-6 leading-tight">
                Build Character,<br>
                <span class="text-purple-400">Not Screen Addiction.</span>
            </h2>
            <p class="text-lg text-gray-300 mb-6">ETHIC crafts highly personalized audio & text stories that gently teach your child real values — infused with the magic of your cultural roots.</p>
        </div>

        <div class="flex-1 glass-card p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <form id="storyForm" class="flex flex-col gap-5">
                <input type="text" id="child_name" placeholder="Child's Name (e.g. Aarav)" class="p-3 rounded-xl bg-gray-900 border border-gray-600 focus:outline-none focus:border-yellow-400 text-white" required>
                
                <input type="text" id="native_place" placeholder="Native Place (e.g. Rajasthan, Pune, Bihar)" class="p-3 rounded-xl bg-gray-900 border border-gray-600 focus:outline-none focus:border-yellow-400 text-white" required>

                <div class="flex gap-4">
                    <select id="age" class="p-3 rounded-xl bg-gray-900 border border-gray-600 flex-1 text-white" required>
                        <option value="" disabled selected>Age</option>
                        <option value="3">3 Years</option>
                        <option value="4">4 Years</option>
                        <option value="5">5 Years</option>
                        <option value="6">6 Years</option>
                        <option value="7">7 Years</option>
                        <option value="8">8 Years</option>
                        <option value="9">9 Years</option>
                        <option value="10">10 Years</option>
                    </select>
                    <select id="gender" class="p-3 rounded-xl bg-gray-900 border border-gray-600 flex-1 text-white" required>
                        <option value="" disabled selected>Gender</option>
                        <option value="Boy">Boy</option>
                        <option value="Girl">Girl</option>
                    </select>
                </div>

                <select id="moral_value" class="p-3 rounded-xl bg-gray-900 border border-gray-600 text-white" required>
                    <option value="" disabled selected>Moral Value to Teach</option>
                    <option value="Sharing & Empathy">Sharing & Empathy (मदद करना)</option>
                    <option value="Bravery">Bravery (बहादुरी)</option>
                    <option value="Honesty">Honesty (ईमानदारी)</option>
                    <option value="Focus">Focus (ध्यान लगाना)</option>
                    <option value="Gratitude">Gratitude (आभार जताना)</option>
                </select>

                <select id="language" class="p-3 rounded-xl bg-gray-900 border border-gray-600 text-white" required>
                    <option value="" disabled selected>Language</option>
                    <option value="Hindi">Pure Hindi (हिंदी)</option>
                    <option value="Hinglish">Hinglish</option>
                    <option value="English">English</option>
                </select>

                <button type="submit" class="glow-btn mt-4 p-4 rounded-xl text-xl flex justify-center items-center gap-2">
                    Create Magical Story ✨
                </button>
            </form>
        </div>
    </main>

    <section id="resultSection" class="max-w-4xl mx-auto mt-16 hidden pb-10">
        <div class="glass-card p-8 md:p-12 rounded-3xl border-l-4 border-yellow-400">
            <h3 class="text-2xl font-bold text-yellow-400 mb-6">📖 Your Magical Story</h3>
            <div id="storyOutput" class="text-gray-100 text-lg leading-relaxed whitespace-pre-wrap font-medium">Generating...</div>
        </div>
    </section>

    <script>
        document.getElementById('storyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // बटन का टेक्स्ट बदलें और लोडिंग दिखाएं
            const btn = e.target.querySelector('button');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = 'AI is writing... ⏳';
            btn.disabled = true;
            
            const resultSection = document.getElementById('resultSection');
            const storyOutput = document.getElementById('storyOutput');
            
            resultSection.classList.remove('hidden');
            storyOutput.innerText = 'Sprinkling magic dust... please wait a few seconds.';

            // फॉर्म से डेटा उठाएं (Native Place भी जुड़ गया है)
            const data = {
                child_name: document.getElementById('child_name').value,
                native_place: document.getElementById('native_place').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                moral_value: document.getElementById('moral_value').value,
                language: document.getElementById('language').value
            };

            try {
                // Python को रिक्वेस्ट भेजें
                const response = await fetch('/generate_story', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                // रिजल्ट दिखाएं
                if(result.success) {
                    storyOutput.innerText = result.story;
                } else {
                    storyOutput.innerText = '❌ Error: ' + result.error;
                }
            } catch(err) {
                storyOutput.innerText = '❌ Server Error: Connection lost with backend.';
            }
            
            // बटन को वापस नार्मल करें
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
        });
    </script>
</body>
</html>
