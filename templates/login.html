{% extends "base.html" %}

{% block content %}
<style>
    /* 🚀 PREMIUM AUTHENTICATION UI */
    .auth-glass-card {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.02);
    }
    
    .auth-input {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #ffffff;
        transition: all 0.3s ease;
    }
    
    .auth-input:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: #f4c95d;
        box-shadow: 0 0 15px rgba(244, 201, 93, 0.15);
        outline: none;
    }
    
    .btn-premium-primary {
        background: #ffffff; color: #050510;
        transition: all 0.3s ease;
        box-shadow: 0 0 15px rgba(255,255,255,0.1);
    }
    .btn-premium-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(255, 255, 255, 0.25);
    }
</style>

<section class="relative flex flex-col items-center justify-center min-h-[85vh] px-5 py-12 overflow-hidden">
    
    <!-- 🌟 Ambient Glowing Orb Behind the Card -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-gold/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Header Text -->
    <div class="text-center mb-8 relative z-10">
        <h1 class="font-magical text-4xl font-bold text-white tracking-wide mb-2">Welcome to ETHIC<span class="text-gold">.</span></h1>
        <p class="text-gray-400 font-medium">Join mindful parents building character.</p>
    </div>

    <!-- 📦 THE GLASS CARD -->
    <div class="auth-glass-card w-full max-w-md p-8 sm:p-10 relative z-10">
        
        <!-- ✨ TABS (Login vs Signup) -->
        <div class="flex gap-4 mb-8 border-b border-white/10 pb-4">
            <button onclick="showTab('login')" id="tab-login" class="flex-1 text-center text-sm font-bold text-white border-b-2 border-gold pb-2 transition-all">
                Log In
            </button>
            <button onclick="showTab('signup')" id="tab-signup" class="flex-1 text-center text-sm font-bold text-gray-500 border-b-2 border-transparent pb-2 transition-all hover:text-gray-300">
                Create Account
            </button>
        </div>

        <!-- 🔐 LOGIN FORM -->
        <form id="form-login" action="/login" method="POST" class="flex flex-col gap-5">
            <input type="hidden" name="action" value="login">
            
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Email Address</label>
                <input type="email" name="email" required placeholder="mom@example.com" class="auth-input w-full rounded-xl px-5 py-3.5 text-sm placeholder-gray-600" />
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-2 ml-1 pr-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Password</label>
                </div>
                <input type="password" name="password" required placeholder="••••••••" class="auth-input w-full rounded-xl px-5 py-3.5 text-sm placeholder-gray-600" />
            </div>
            
            <button type="submit" class="btn-premium-primary mt-4 w-full rounded-xl px-7 py-3.5 text-base font-bold flex items-center justify-center gap-2">
                Log In <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </form>

        <!-- 🚀 SIGNUP FORM (Hidden by default) -->
        <form id="form-signup" action="/login" method="POST" class="flex flex-col gap-5 hidden">
            <input type="hidden" name="action" value="signup">
            
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Parent's Name</label>
                <input type="text" name="name" required placeholder="E.g. Priya Sharma" class="auth-input w-full rounded-xl px-5 py-3.5 text-sm placeholder-gray-600" />
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Email Address</label>
                <input type="email" name="email" required placeholder="mom@example.com" class="auth-input w-full rounded-xl px-5 py-3.5 text-sm placeholder-gray-600" />
            </div>
            
            <div>
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">Create Password</label>
                <input type="password" name="password" required placeholder="Min 6 characters" class="auth-input w-full rounded-xl px-5 py-3.5 text-sm placeholder-gray-600" />
            </div>
            
            <button type="submit" class="mt-4 w-full rounded-xl border-2 border-gold text-gold bg-gold/5 px-7 py-3.5 text-base font-bold hover:bg-gold hover:text-navy transition shadow-[0_0_15px_rgba(244,201,93,0.2)]">
                Create Account
            </button>
        </form>

    </div>
</section>

<!-- ⚙️ Smart JS to toggle forms and update styles safely -->
<script>
    function showTab(tabName) {
        const formLogin = document.getElementById('form-login');
        const formSignup = document.getElementById('form-signup');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        // Classes for Active and Inactive states
        const activeClasses = ['text-white', 'border-gold'];
        const inactiveClasses = ['text-gray-500', 'border-transparent', 'hover:text-gray-300'];

        if(tabName === 'login') {
            // Show Login, Hide Signup
            formLogin.classList.remove('hidden');
            formSignup.classList.add('hidden');
            
            // Update Login Tab Style
            tabLogin.classList.remove(...inactiveClasses);
            tabLogin.classList.add(...activeClasses);
            
            // Update Signup Tab Style
            tabSignup.classList.remove(...activeClasses);
            tabSignup.classList.add(...inactiveClasses);
        } else {
            // Show Signup, Hide Login
            formSignup.classList.remove('hidden');
            formLogin.classList.add('hidden');
            
            // Update Signup Tab Style
            tabSignup.classList.remove(...inactiveClasses);
            tabSignup.classList.add(...activeClasses);
            
            // Update Login Tab Style
            tabLogin.classList.remove(...activeClasses);
            tabLogin.classList.add(...inactiveClasses);
        }
    }
</script>
{% endblock %}
