<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETHIC App - Login & Story</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            background: #0078D4;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
            font-weight: bold;
        }
        button:hover {
            background: #005a9e;
        }
        #statusText {
            margin-top: 20px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>ETHIC में आपका स्वागत है</h2>
        <p>बच्चों के लिए बेहतरीन और मज़ेदार कहानियाँ</p>
        
        <!-- ऑडियो प्ले करने का बटन -->
        <button id="playBtn">▶ कहानी प्ले करें (आरती)</button>
        <div id="statusText"></div>
    </div>

    <!-- बैकएंड से कनेक्ट करने वाली स्क्रिप्ट -->
    <script>
        async function playStoryAudio(storyText) {
            const statusText = document.getElementById("statusText");
            statusText.innerText = "ऑडियो लोड हो रहा है... कृपया रुकें।";
            
            try {
                const response = await fetch('/api/generate-audio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: storyText })
                });

                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    
                    audio.onended = () => {
                        statusText.innerText = "कहानी समाप्त हुई।";
                    };

                    audio.play();
                    statusText.innerText = "कहानी चल रही है 🎵";
                } else {
                    statusText.innerText = "एरर: बैकएंड से आवाज़ नहीं बन पाई।";
                }
            } catch (error) {
                statusText.innerText = "एरर: सर्वर से कनेक्शन टूट गया।";
                console.error("Fetch error:", error);
            }
        }

        // बटन दबाने पर यह कहानी प्ले होगी
        document.getElementById("playBtn").addEventListener("click", function() {
            const textToPlay = "नमस्ते, मैं आरती हूँ। एथिक ऐप में आपका स्वागत है। चाँद की परी की कहानी सुनने के लिए तैयार हो जाइये!";
            playStoryAudio(textToPlay);
        });
    </script>

</body>
</html>
